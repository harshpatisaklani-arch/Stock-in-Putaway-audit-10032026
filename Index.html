<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --paper:#EEF1F5; --card:#FFFFFF; --line:#D3DAE3;
    --go:#0A7B5C; --bin:#F2B705; --bad:#C62828; --muted:#5B6678;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 "IBM Plex Sans",system-ui,sans-serif;padding-bottom:40px}
  header{background:var(--ink);color:#fff;padding:14px 16px;font-weight:600;font-size:18px}
  main{max-width:520px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  label{display:block;font-weight:600;margin-bottom:6px}
  label small{font-weight:400;color:var(--muted)}
  input,select,textarea{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
  input:disabled,select:disabled{background:#E6EBF1;color:var(--muted)}
  button{font:inherit;font-weight:600;width:100%;padding:14px;border:0;border-radius:8px;background:var(--ink);color:#fff;margin-top:10px}
  button.go{background:var(--go)}
  button.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
  button:disabled{opacity:.45}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:10px}
  .bar b{color:var(--ink)}
  .progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
  .progress i{display:block;height:100%;background:var(--go);width:0;transition:width .3s}
  .bin{background:var(--bin);border-radius:10px;padding:14px;text-align:center;margin-bottom:12px}
  .bin span{display:block;font-size:13px;font-weight:600}
  .bin strong{font:600 32px "IBM Plex Mono",monospace;letter-spacing:1px;word-break:break-all}
  .sku{border-left:6px solid var(--go);background:#fff;padding:12px;border-radius:8px;margin-bottom:12px;border:1px solid var(--line);border-left-width:6px}
  .sku .upc{font:600 22px "IBM Plex Mono",monospace;word-break:break-all}
  .sku .desc{color:var(--muted);margin-top:4px}
  .field{margin-bottom:12px}
  .ok{color:var(--go);font-weight:600;font-size:14px;margin-top:4px}
  #toast{position:fixed;left:12px;right:12px;bottom:16px;max-width:496px;margin:0 auto;padding:14px;border-radius:8px;color:#fff;font-weight:600;display:none;z-index:9}
  #toast.err{background:var(--bad)} #toast.good{background:var(--go)}
  #busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;font-weight:600;z-index:8}
  .hide{display:none}
  .shake{animation:sh .3s}
  @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #preview{max-width:100%;border-radius:8px;margin-top:8px}
  .done{text-align:center;padding:24px 8px}
  .done h2{margin:0 0 6px;color:var(--go)}
  .row{display:flex;gap:8px}
  .row input{flex:1;min-width:0}
  button.scan{width:auto;margin-top:0;padding:0 16px;background:var(--bin);color:var(--ink);white-space:nowrap}
  .seg{display:flex;gap:8px}
  .seg button{margin-top:0;background:#fff;color:var(--ink);border:2px solid var(--line)}
  .seg button.on{border-color:var(--go);background:#E3F3EE}
  .seg button.on.bad{border-color:var(--bad);background:#FBE9E7}
  #scanner{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
  #scanner .top{color:#fff;padding:14px 16px;font-weight:600}
  #reader{flex:1;min-height:0;background:#000;overflow:hidden}
  #scanner .bottom{padding:12px;background:#000}
  #scanner .bottom button{margin-top:8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';document.head.appendChild(s)"></script>
</head>
<body>
<header>Putaway Audit</header>
<main>

  <!-- HOME: employee + floor + generate -->
  <section id="home" class="card">
    <div class="field">
      <label for="emp">Employee code</label>
      <input id="emp" autocomplete="off" autocapitalize="characters" placeholder="Type your employee code">
    </div>
    <div class="field hide" id="floorWrap">
      <label for="floor">Floor</label>
      <select id="floor"></select>
    </div>
    <button id="genBtn" class="go" disabled>Generate task</button>
  </section>

  <!-- TASK -->
  <section id="task" class="hide">
    <div class="bar"><span>Task <b id="tId"></b> &middot; Floor <b id="tFloor"></b></span><span>Line <b id="tLine"></b></span></div>
    <div class="progress"><i id="prog"></i></div>

    <div class="bin"><span>Go to bin</span><strong id="sugLoc"></strong></div>

    <div class="card">
      <div class="field">
        <label for="loc">Scan location</label>
        <div class="row"><input id="loc" autocomplete="off" autocapitalize="characters" placeholder="Scan or type bin"><button class="scan" id="locScan" type="button">Scan QR</button></div>
        <div class="ok hide" id="locOk">Bin matched</div>
      </div>

      <div id="skuBlock" class="hide">
        <div class="sku"><div class="upc" id="sugUpc"></div><div class="desc" id="sugDesc"></div></div>
        <div class="field">
          <label for="upc">Scan UPC</label>
          <div class="row"><input id="upc" autocomplete="off" placeholder="Scan or type UPC"><button class="scan" id="upcScan" type="button">Scan barcode</button></div>
          <div class="ok hide" id="upcOk">UPC matched</div>
        </div>
      </div>

      <div id="countBlock" class="hide">
        <div class="field">
          <label for="qty">Physical quantity</label>
          <input id="qty" type="number" inputmode="numeric" min="0" step="1" placeholder="Count of units in the bin">
        </div>
        <div class="field">
          <label for="health">Bin health <small>(optional)</small></label>
          <input id="health" type="hidden" value="OK"><div class="seg"><button type="button" id="hOk" class="on">Bin is fine</button><button type="button" id="hBad">Bin is not fine</button></div>
          <div id="photoWrap" style="margin-top:8px">
            <input id="photo" type="file" accept="image/*" capture="environment" class="hide"><button type="button" id="photoBtn" class="ghost" style="margin-top:0">Take bin photo</button>
            <img id="preview" class="hide" alt="Bin photo preview">
          </div>
        </div>
        <div class="field">
          <label for="rem">Remarks <small>(optional)</small></label>
          <textarea id="rem" rows="2"></textarea>
        </div>
        <button id="submitBtn" class="go">Submit line</button>
      </div>
    </div>
  </section>

  <!-- TASK COMPLETE -->
  <section id="finish" class="card done hide">
    <h2>Task complete</h2>
    <div id="finMsg"></div>
    <button id="backBtn">Back to my tasks</button>
  </section>
</main>

<div id="scanner">
  <div class="top" id="scanTitle"></div>
  <div id="reader"></div>
  <div class="bottom">
    <div id="scanMsg" style="color:#ffd54f;font-size:14px"></div>
    <input id="scanFile" type="file" accept="image/*" capture="environment" class="hide">
    <button id="scanPhoto" class="go" type="button">Take photo of code</button>
    <button id="scanCancel" class="ghost" type="button">Cancel</button>
  </div>
</div>
<div id="toast"></div>
<div id="busy">Please wait...</div>

<script>
const $ = id => document.getElementById(id);
const S = { emp:'', floor:'', taskId:'', line:null, locOk:false, upcOk:false, img:'', locAttempts:0 };

function busy(on){ $('busy').style.display = on ? 'flex' : 'none'; }
function toast(msg, isErr){
  const t = $('toast'); t.textContent = msg; t.className = isErr ? 'err' : 'good'; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.style.display='none', isErr ? 3500 : 1800);
  if (isErr && navigator.vibrate) navigator.vibrate(250);
}
// Paste your Apps Script Web app URL here (ends with /exec)
const API_URL = 'https://script.google.com/a/macros/zomato.com/s/AKfycbxuaPpPpRzNZJ6Kz0Kh8vE4tmBSLfPpWymlcF9grr1QxKLk7pH52kGeEyFJT6Eq61QZKw/exec';

function call(fn, args, ok){
  busy(true);
  fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ fn: fn, args: args }) })
    .then(r => r.json())
    .then(j => {
      busy(false);
      if (j.error) { toast(j.error, true); return; }
      ok(j.result);
    })
    .catch(() => { busy(false); toast('Network error. Check internet and try again.', true); });
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function show(id){ ['home','task','finish'].forEach(x => $(x).classList.toggle('hide', x !== id)); }

/* ---- 1. Employee -> floors ---- */
$('emp').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('emp').addEventListener('change', loadFloors);
$('emp').addEventListener('input', () => { $('floorWrap').classList.add('hide'); $('genBtn').disabled = true; });

function loadFloors(){
  const emp = $('emp').value.trim();
  if (!emp) return;
  call('api_getFloors', [emp], r => {
    if (!r.ok) { toast(r.msg, true); $('floorWrap').classList.add('hide'); $('genBtn').disabled = true; return; }
    S.emp = r.emp;
    const sel = $('floor');
    sel.innerHTML = '';
    if (r.floors.length > 1) sel.innerHTML = '<option value="">Select floor</option>';
    r.floors.forEach(f => {
      const o = document.createElement('option');
      o.value = f.floor;
      o.textContent = f.floor + '  (' + f.tasks + (f.tasks > 1 ? ' tasks, ' : ' task, ') + f.lines + ' lines)';
      sel.appendChild(o);
    });
    $('floorWrap').classList.remove('hide');
    $('genBtn').disabled = false;
  });
}

/* ---- 2. Generate task ---- */
$('genBtn').onclick = () => {
  const floor = $('floor').value;
  if (!floor) { toast('Select a floor first.', true); return; }
  call('api_generateTask', [S.emp, floor], r => {
    if (!r.ok) { toast(r.msg, true); return; }
    S.taskId = r.taskId; S.floor = floor;
    renderLine(r);
  });
};

function renderLine(r){
  if (r.done) {
    $('finMsg').textContent = r.completed + ' of ' + r.total + ' lines audited.';
    show('finish'); return;
  }
  S.line = r; S.locOk = false; S.upcOk = false; S.img = ''; S.locAttempts = 0;
  $('tId').textContent = r.taskId; $('tFloor').textContent = r.floor;
  $('tLine').textContent = r.lineNo + ' / ' + r.total;
  $('prog').style.width = ((r.lineNo - 1) / r.total * 100) + '%';
  $('sugLoc').textContent = r.location;
  ['loc','upc','qty','rem'].forEach(id => { $(id).value = ''; $(id).disabled = false; }); $('locScan').disabled = false; $('upcScan').disabled = false;
  setHealth('OK');
  ['locOk','upcOk','skuBlock','countBlock'].forEach(id => $(id).classList.add('hide'));
  show('task');
  $('loc').focus();
}

/* ---- 3. Location ---- */
$('loc').addEventListener('keydown', e => { if (e.key === 'Enter') verifyLoc(); });
function verifyLoc(){
  const v = $('loc').value.trim(); if (!v) return;
  call('api_verifyLocation', [S.emp, S.taskId, S.line.seq, v], r => {
    if (!r.ok) {
      S.locAttempts++;
      toast(r.msg, true); shake($('loc')); $('loc').value = ''; $('loc').focus(); return;
    }
    S.locOk = true; S.scannedLoc = v;
    $('loc').disabled = true; $('locScan').disabled = true; $('locOk').classList.remove('hide');
    $('sugUpc').textContent = r.upc; $('sugDesc').textContent = r.description;
    $('skuBlock').classList.remove('hide');
    $('upc').focus();
  });
}

/* ---- 4. UPC ---- */
$('upc').addEventListener('keydown', e => { if (e.key === 'Enter') verifyUpc(); });
function verifyUpc(){
  const v = $('upc').value.trim(); if (!v) return;
  call('api_verifyUpc', [S.emp, S.taskId, S.line.seq, v], r => {
    if (!r.ok) { toast(r.msg, true); shake($('upc')); $('upc').value = ''; $('upc').focus(); return; }
    S.upcOk = true; S.scannedUpc = v;
    $('upc').disabled = true; $('upcScan').disabled = true; $('upcOk').classList.remove('hide');
    $('countBlock').classList.remove('hide');
    $('qty').focus();
  });
}

/* ---- 6. Bin health + photo (compressed in the browser) ---- */
function setHealth(v){
  $('health').value = v;
  $('hOk').classList.toggle('on', v === 'OK');
  $('hBad').classList.toggle('on', v !== 'OK');
  $('hBad').classList.toggle('bad', v !== 'OK');
  if (v === 'OK') { S.img = ''; $('photo').value = ''; $('preview').classList.add('hide'); $('photoBtn').textContent = 'Take bin photo'; }
}
$('hOk').onclick = () => setHealth('OK');
$('hBad').onclick = () => setHealth('NOT_OK');
$('photoBtn').onclick = () => $('photo').click();
$('photo').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 1024, k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      S.img = c.toDataURL('image/jpeg', 0.7);
      $('preview').src = S.img; $('preview').classList.remove('hide');
      $('photoBtn').textContent = 'Retake bin photo';
      $('health').value = 'NOT_OK'; $('hOk').classList.remove('on'); $('hBad').classList.add('on','bad');
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
};

/* ---- Camera scanner (QR for bin, barcode for UPC) ---- */
let scanObj = null, scanCb = null;
function scanFormats(kind){
  const F = Html5QrcodeSupportedFormats;
  return kind === 'qr'
    ? [F.QR_CODE, F.CODE_128, F.CODE_39]
    : [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF];
}
function openScanner(kind, cb){
  if (typeof Html5Qrcode === 'undefined') { toast('Scanner could not load. Check internet or type manually.', true); return; }
  scanCb = cb;
  $('scanTitle').textContent = kind === 'qr' ? 'Point the camera at the bin QR code' : 'Point the camera at the product barcode';
  $('scanMsg').textContent = '';
  $('scanner').style.display = 'flex';
  scanObj = new Html5Qrcode('reader', { formatsToSupport: scanFormats(kind), useBarCodeDetectorIfSupported: true, verbose: false });
  const box = kind === 'qr'
    ? (w, h) => { const s = Math.max(60, Math.floor(Math.min(w, h) * 0.7)); return { width: s, height: s }; }
    : (w, h) => ({ width: Math.max(60, Math.floor(w * 0.85)), height: Math.max(60, Math.floor(h * 0.35)) });
  scanObj.start({ facingMode: 'environment' }, { fps: 10, qrbox: box }, txt => gotScan(txt), () => {})
    .catch(() => { $('scanMsg').textContent = 'Camera could not start. Allow camera permission for this site, or tap "Take photo of code" below.'; });
}
function gotScan(txt){
  const cb = scanCb;
  closeScanner().then(() => { if (navigator.vibrate) navigator.vibrate(80); cb(String(txt).trim()); });
}
function closeScanner(){
  $('scanner').style.display = 'none';
  const o = scanObj; scanObj = null;
  if (!o) return Promise.resolve();
  return o.stop().catch(() => {}).then(() => { try { o.clear(); } catch (e) {} });
}
$('scanCancel').onclick = () => closeScanner();
$('scanPhoto').onclick = () => $('scanFile').click();
$('scanFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !scanObj) return;
  const o = scanObj;
  $('scanMsg').textContent = 'Reading code...';
  o.stop().catch(() => {}).then(() => o.scanFile(f, false))
    .then(txt => gotScan(txt))
    .catch(() => { $('scanMsg').textContent = 'Could not read the code. Retake the photo closer and sharper, or cancel and type it.'; });
};
$('locScan').onclick = () => openScanner('qr', v => { $('loc').value = v; verifyLoc(); });
$('upcScan').onclick = () => openScanner('barcode', v => { $('upc').value = v; verifyUpc(); });

/* ---- 5, 7, 8. Submit ---- */
$('submitBtn').onclick = () => {
  if (!S.locOk || !S.upcOk) { toast('Scan the bin and UPC first.', true); return; }
  const q = $('qty').value.trim();
  if (!/^\d+$/.test(q)) { toast('Enter physical quantity (0 or more).', true); shake($('qty')); $('qty').focus(); return; }
  $('submitBtn').disabled = true;
  call('api_submit', [{
    emp:S.emp, taskId:S.taskId, seq:S.line.seq, scannedLoc:S.scannedLoc, scannedUpc:S.scannedUpc,
    qty:q, health:$('health').value, imageData:S.img, remarks:$('rem').value.trim(), locAttempts:S.locAttempts
  }], r => {
    $('submitBtn').disabled = false;
    if (!r.ok) { toast(r.msg, true); return; }
    toast('Line submitted', false);
    renderLine(r);
  });
};

/* ---- back to home ---- */
$('backBtn').onclick = () => { show('home'); loadFloors(); };
</script>
</body>
</html>
